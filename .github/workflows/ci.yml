name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: https://paladinhubv2-server.onrender.com
      NEXT_PUBLIC_SITE_URL: https://paladinhubv2-client.onrender.com
      SEO_BUILD_COMMIT: ${{ github.sha }}
      SEO_BUILD_RETRY_DELAY_MS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (existing debt, non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build deterministic static export
        env:
          SEO_BUILD_SOURCE: fixture
        run: npm run build

      - name: Verify SEO export artifacts
        run: npm run verify:seo-export

      - name: Verify production SEO snapshot failure blocks export
        env:
          SEO_BUILD_SOURCE: api
          SEO_BUILD_RETRY_DELAY_MS: "0"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:9
        run: |
          set +e
          npm run build > /tmp/seo-fail-closed.log 2>&1
          status=$?
          set -e
          cat /tmp/seo-fail-closed.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the API-backed SEO build to fail when its snapshot endpoint is unavailable."
            exit 1
          fi
          grep -q "SEO build failed" /tmp/seo-fail-closed.log
